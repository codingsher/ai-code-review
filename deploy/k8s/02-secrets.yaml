# Template — create real secret with:
# kubectl -n code-review create secret generic app-secrets \
#   --from-literal=GITHUB_CLIENT_ID=... --from-literal=GITHUB_CLIENT_SECRET=... \
#   --from-literal=GITHUB_WEBHOOK_SECRET=... --from-literal=GITHUB_TOKEN=... \
#   --from-literal=ANTHROPIC_API_KEY=... --from-literal=JWT_SECRET=... \
#   --from-literal=INTERNAL_API_SECRET=... --from-literal=POSTGRES_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: code-review
type: Opaque
stringData:
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITHUB_WEBHOOK_SECRET: ""
  GITHUB_TOKEN: ""
  ANTHROPIC_API_KEY: ""
  JWT_SECRET: ""
  INTERNAL_API_SECRET: ""
  POSTGRES_PASSWORD: ""
