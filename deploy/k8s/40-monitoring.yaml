apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: code-review
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [code-review] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: code-review
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
          ports: [{ containerPort: 9090 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: code-review
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: code-review
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: code-review
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: code-review }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: code-review
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: code-review
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          env:
            - name: GF_DATASOURCES_DEFAULT_URL
              value: http://prometheus:9090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: code-review
spec:
  selector: { app: grafana }
  ports: [{ port: 3000 }]
