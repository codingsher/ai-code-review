apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: code-review
data:
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/codereview
  API_INTERNAL_URL: http://api:8000
  LLM_MODEL: claude-sonnet-4-6
  LLM_MIN_CONFIDENCE: "0.5"
