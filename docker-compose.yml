services:
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codereview
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./api
    ports: ["8000:8000"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/codereview
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret}
    depends_on: [redis, postgres, migrate]

  migrate:
    build: ./api
    command: alembic upgrade head
    environment:
      PYTHONPATH: /srv
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/codereview
    depends_on: [postgres]

  worker:
    build: ./worker
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret}
    depends_on: [redis]
    deploy:
      replicas: 2

volumes:
  pgdata:
